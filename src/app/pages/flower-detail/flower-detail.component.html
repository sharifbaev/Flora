<div class="flex flex-col gap-y-10 sm:gap-y-20 lg:gap-y-32 p-4 sm:p-6 bg-[#FCF9F8]">
  <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 lg:gap-x-5">
    <div class="lg:col-span-3 flex justify-center">
      <img
        [ngSrc]="flower.src"
        alt=""
        class="w-full max-w-[600px] h-auto object-cover rounded-xl"
        height="200"
        width="600">
    </div>

    <div class="lg:col-span-2 flex flex-col p-2 sm:p-4 justify-between gap-y-6">
      <div class="flex flex-col gap-y-6 sm:gap-y-8">
        <div>
          <span *ngIf="flower?.status" class="border border-green-600 text-green-600 px-2 py-1 rounded-md bg-green-100 text-xs sm:text-sm">
            В наличии
          </span>

          <span *ngIf="!flower?.status" class="border border-red-600 text-red-600 px-2 py-1 rounded-md bg-red-100 text-xs sm:text-sm">
            Нет наличии
          </span>
        </div>

        <h2 class="text-primary text-3xl sm:text-5xl lg:text-6xl font-bold">
          {{ flower?.name }}
        </h2>

        <p class="text-2xl sm:text-4xl lg:text-5xl font-medium">
          {{ flower?.price | spaceNumber }}$
        </p>

        <div>
          <p class="font-light text-sm sm:text-base">ВЫБОР РАЗМЕРА</p>
          <div class="flex flex-wrap gap-2 sm:gap-x-3 py-2">
            <div *ngFor="let size of sizes"
                 (click)="selectedSize = size.key"
                 class="py-1 sm:py-2 px-3 sm:px-4 cursor-pointer transition text-sm sm:text-base"
                 [ngClass]="selectedSize === size.key ? 'bg-primary text-white' : 'bg-greybackground text-black'">

              {{ size.label }}

            </div>
          </div>
        </div>

        <div>
          <p class="font-light mb-2 text-sm sm:text-base">ОПИСАНИЕ</p>
          <p class="text-sm sm:text-base leading-relaxed">
            {{ flower?.description }}
          </p>
        </div>

        <div>
          <p class="font-light mb-2 text-sm sm:text-base">КОЛИЧЕСТВО</p>
          <div class="flex justify-between items-center bg-greybackground py-2 sm:py-3 w-full sm:w-1/2 lg:w-1/5">
            <span class="text-xl font-bolder cursor-pointer px-4" (click)="setCount('minus')">-</span>
            <span class="text-xl font-bolder px-2">{{ count }}</span>
            <span class="text-xl font-bolder cursor-pointer px-4" (click)="setCount('add')">+</span>
          </div>
        </div>

      </div>
      <div class="flex items-center justify-center gap-x-1">
        <button class="border border-primary rounded text-white bg-primary w-full lg:w-1/3 py-3 text-sm sm:text-base active:scale-95 transition">
          Заказать
        </button>
      </div>
    </div>
  </div>

  <div>
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center text-xl sm:text-2xl lg:text-3xl mb-6 sm:mb-10 gap-y-3">
      <p>ОТЗЫВЫ</p>
      <div class="flex items-center gap-x-1 flex-wrap">
        <span class="font-medium text-black">4.9</span>
        <lucide-icon name="star" strokeWidth="2" size="20" class="sm:size-[24px]" />
        <span class="text-sm sm:text-lg lg:text-xl font-light">
          ({{ flower?.comment?.length }} отзыва)
        </span>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 items-stretch">
      <comment-card
        *ngFor="let comment of flower?.comment"
        [comment]="comment">
      </comment-card>
    </div>
  </div>
</div>
