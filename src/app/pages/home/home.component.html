<div>
  <div *ngIf="isFilterOpen" class="fixed inset-0 bg-black/50 z-40 transition-opacity" (click)="isFilterOpen = false"></div>
  <div class="fixed top-0 left-0 h-full w-[80%] max-w-[300px] bg-white z-50 transform transition-transform duration-300 ease-in-out"
       [ngClass]="isFilterOpen ? 'translate-x-0' : '-translate-x-full'">
    <div class="p-4 flex justify-between items-center border-b">
      <span class="font-semibold">Фильтры</span>
      <button (click)="isFilterOpen = false"> ✕ </button>
    </div>

    <div>
      <product-filters></product-filters>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-5 h-full w-full min-h-screen">
    <div class="col-span-1 hidden md:block">
      <product-filters></product-filters>
    </div>

    <div class="flex flex-col gap-y-5 col-span-1 md:col-span-4 px-4 sm:px-6 md:px-12 bg-semigreybackground w-full min-w-0">
      <h2 class="font-semibold text-4xl sm:text-4xl lg:text-6xl leading-tight">
        Найдите свой <br> <span class="text-primary">идеальный</span> букет
      </h2>

      <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 w-full min-w-0">
        <div class="w-full md:w-auto min-w-0">
          <div class="flex justify-between md:justify-end items-center gap-2">
            <!-- MOBILE FILTER BUTTON (added here) -->
            <button class="md:hidden bg-primary text-white px-3 py-2 rounded-full shadow" (click)="isFilterOpen = true">
              Фильтры
            </button>

            <p-dropdown
              class="w-full md:w-[250px] max-w-full"
              [options]="cities"
              [(ngModel)]="selectedCity"
              optionLabel="name"
              placeholder="Сортировать по...">
            </p-dropdown>
          </div>
        </div>
      </div>

      <div class="w-full">
        <product-list
          [products]="products"
        />
      </div>
    </div>
  </div>
</div>
